  canvas { position: fixed; inset: 0; display: block; pointer-events: none; }

  .hint {
    position: fixed; right: 40px; bottom: 42px; pointer-events: none;
    font-size: 11.5px; letter-spacing: .3em; color: rgba(255,255,255,.46);
    opacity: 0; animation: hint 1.4s 1s ease forwards, hintOut 1.6s 14s ease forwards;
  }
  @keyframes hint    { from { opacity: 0; } to { opacity: .5; } }
  @keyframes hintOut { from { opacity: .5; } to { opacity: 0; } }

<body>

<div class="stage" id="stage"></div>
<div class="mist"></div>
<div class="mist b"></div>
<div class="vignette"></div>
<canvas id="ink"></canvas>
<div class="hint">按住 · 蓄墨 &nbsp;|&nbsp; 松手 · 出鞘 &nbsp;|&nbsp; D · 自动演示</div>

<script>
(() => {
  const canvas = document.getElementById('ink');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  let W = 0, H = 0, DPR = 1;

  /* ---------- 背景图几何：background-size: cover 的映射 ---------- */
  const IW = 1920, IH = 1080;
  let cover = 1, baseScale = 1.03, parX = 0, parY = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- 刀的骨线（图片比例坐标 0~1） ---------- */
  const BLADE = [
    { x: .470, y: .735 }, { x: .445, y: .690 }, { x: .420, y: .640 },
    { x: .395, y: .590 }, { x: .368, y: .540 }, { x: .340, y: .492 },
    { x: .312, y: .445 }, { x: .283, y: .400 }, { x: .255, y: .356 }
  ];
  const GUARD = { x: .472, y: .742 };  // 护手
  const INK   = { x: .500, y: .560 };  // 放射中心（人物身上）

  // 覆盖图层的 stage 变换（inset -3% + scale）→ 屏幕坐标
  function toScreen(p) {
    const k = cover * baseScale;
    const cx = W / 2 + parX, cy = H / 2 + parY;
    return {
      x: cx + (p.x * IW - IW / 2) * k,
      y: cy + (p.y * IH - IH / 2) * k
    };
  }
  function bladeScreen() { return BLADE.map(toScreen); }

  function bladeLengths(pts) {
    const lens = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const l = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      lens.push(l); total += l;
    }
    return { lens, total };
  }

  function nearestOnBlade(px, py, pts) {
    const { lens, total } = bladeLengths(pts);
    let best = { d2: Infinity, x: 0, y: 0, t: 0 };
    let acc = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const L2 = dx * dx + dy * dy || 1;
      const t = clamp(((px - a.x) * dx + (py - a.y) * dy) / L2, 0, 1);
      const qx = a.x + dx * t, qy = a.y + dy * t;
      const d2 = (px - qx) * (px - qx) + (py - qy) * (py - qy);
      if (d2 < best.d2) best = { d2, x: qx, y: qy, t: (acc + lens[i] * t) / total };
      acc += lens[i];
    }
    best.dist = Math.sqrt(best.d2);
    return best;
  }

  // 沿骨线取归一化位置 u（0=护手端，1=刀尖）
  function pointAt(u, pts) {
    const { lens, total } = bladeLengths(pts);
    const target = clamp(u, 0, 1) * total;
    let acc = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      if (acc + lens[i] >= target) {
        const t = (target - acc) / (lens[i] || 1);
        return {
          x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
          y: pts[i].y + (pts[i + 1].y - pts[i].y) * t
        };
      }
      acc += lens[i];
    }
    const last = pts[pts.length - 1];
    return { x: last.x, y: last.y };
  }

  /* ---------- 粒子容器 ---------- */
  const splashes = [], drops = [], sparks = [], streaks = [], strokes = [], drips = [];
  const flash = { a: 0 };

  /* ---------- 落墨：按住越久，墨越重 ---------- */
  function inkSplash(x, y, hold) {
    const h = clamp(hold, 0, 3.2);
    const heavy = h / 3.2;                    // 0 轻 ~ 1 重
    const size  = 0.55 + 1.85 * Math.pow(heavy, 0.85);
    const wMul  = 0.75 + 2.10 * heavy;        // 笔画粗细

    const rings = 2 + Math.round(heavy * 3);
    for (let i = 0; i < rings; i++) {
      splashes.push({
        x: x + rand(-9, 9) * (0.5 + heavy), y: y + rand(-9, 9) * (0.5 + heavy),
        max: rand(70, 130) * size,
        line: rand(1.1, 2.8) * wMul,
        alpha: (0.20 + 0.42 * heavy) * rand(0.85, 1.1),
        delay: i * (95 + 40 * heavy),
        life: 0, dur: rand(950, 1500) * (0.85 + 0.5 * heavy),
        wob: rand(0.5, 1.6)
      });
    }

    const n = Math.round(rand(14, 26) + 62 * Math.pow(heavy, 1.2));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(1.0, 6.6) * (0.5 + 1.25 * heavy);
      drops.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0.4, 1.8),
        r: rand(0.7, 3.4) * (0.8 + 1.5 * heavy),
        life: 0, dur: rand(520, 1150), drag: rand(0.93, 0.975)
      });
    }

    if (heavy > 0.3) {
      for (let i = 0; i < 1 + heavy * 2; i++) {
        drops.push({
          x: x + rand(-10, 10), y: y + rand(-6, 6),
          vx: rand(-1.6, 1.6), vy: rand(-0.6, 0.8),
          r: rand(3, 6) * (0.8 + heavy),
          life: 0, dur: rand(900, 1500), drag: 0.985
        });
      }
    }

    for (let i = 0; i < 2 + heavy * 5; i++) {
      const a = Math.random() * Math.PI * 2, sp = rand(1.2, 5) * (0.6 + heavy);
      drips.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, 1),
        r: rand(1, 3.4) * (0.8 + heavy), life: 0, dur: rand(700, 1300), drag: 0.96
      });
    }
    return heavy;
  }

  /* ---------- 蓄墨：按住期间持续渗墨 ---------- */
  function inkDuringHold(x, y, h) {
    if (Math.random() < 0.06 + 0.06 * h) {
      drips.push({
        x: x + rand(-9, 9) * (0.4 + h * 0.6),
        y: y + rand(-9, 9) * (0.4 + h * 0.6),
        vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.4),
        r: rand(1.2, 2.6) * (0.9 + h), life: 0, dur: rand(1100, 1900), drag: 0.985
      });
    }
  }

  /* ---------- 寒光：随机位置 + 刀身扫过 ---------- */
  const slashes = [], glints = [];
  const bloom = { x: 0, y: 0, r: 0, a: 0 };
  const sparkle = { active: false, u: 0.5, life: 0, dur: 900, wait: 1600 };
  const gleam = { hoverU: 0, hoverD: 0 };

  function slash(cx, cy) {
    const pts = bladeScreen();
    const c0 = toScreen(INK);
    const prox = clamp(1 - Math.hypot(cx - c0.x, cy - c0.y) / (Math.min(W, H) * 0.62), 0, 1);

    // 随机一段刀身
    const u0 = rand(0.02, 0.72);
    const len = rand(0.26, 0.55);
    slashes.push({ u0, u1: Math.min(1, u0 + len), life: 0, dur: rand(520, 820), w: rand(4, 7) });

    // 出鞘那一瞬的聚光
    const hp = pointAt(u0 + len, pts);
    bloom.x = hp.x; bloom.y = hp.y; bloom.r = 30; bloom.a = 1;

    // 随机飞溅的寒光点
    const n = 2 + Math.round(rand(0, 2.6) * (0.4 + prox));
    for (let i = 0; i < n; i++) {
      const u = rand(0.05, 0.95);
      const p = pointAt(u, pts);
      glints.push({
        x: p.x + rand(-12, 12), y: p.y + rand(-12, 12),
        u, life: 0, dur: rand(360, 820), r: rand(10, 26), a: rand(0.5, 1)
      });
    }

    flash.a = Math.min(0.5, 0.1 + 0.3 * prox + flash.a * 0.35);
    speedLines(0.5 + prox);
  }

  function sparkleOnBlade() {
    const pts = bladeScreen();
    sparkle.u = rand(0.03, 0.97);
    sparkle.life = 0;
    sparkle.dur = rand(700, 1200);
    sparkle.active = true;
    const p = pointAt(sparkle.u, pts);
    sparkAt(p.x + rand(-6, 6), p.y + rand(-6, 6), 2, 0.6);
  }

  function speedLines(power) {
    const c = toScreen(INK);
    const n = Math.round(rand(12, 20) * power);
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      streaks.push({
        x: c.x + Math.cos(a) * rand(10, 70), y: c.y + Math.sin(a) * rand(10, 70),
        vx: Math.cos(a) * rand(9, 22), vy: Math.sin(a) * rand(9, 22) * 0.7,
        life: 0, dur: rand(320, 640), w: rand(0.6, 2.2)
      });
    }
    stage.classList.add('surge');
    stage.style.setProperty('--s', (1.04 + 0.022 * power).toFixed(3));
    clearTimeout(stage._st);
    stage._st = setTimeout(() => {
      stage.classList.remove('surge');
      stage.style.setProperty('--s', '1.03');
    }, 460);
  }

  function sparkAt(x, y, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(.6, 3.4) * power;
      sparks.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, .8),
        r: rand(.5, 1.7), life: 0, dur: rand(300, 720), drag: rand(.94, .98)
      });
    }
  }

  /* ---------- 悬浮尘埃 ---------- */
  const motes = [];
  const MOUSE = { px: -999, py: -999, tx: -999, ty: -999, in: false };

  function seedMotes() {
    motes.length = 0;
    const count = Math.round(Math.min(130, (W * H) / 17000));
    for (let i = 0; i < count; i++) {
      motes.push({
        x: rand(0, W), y: rand(0, H),
        vx: rand(-0.16, 0.16), vy: rand(-0.3, -0.05),
        r: rand(0.5, 2.4), a: rand(0.10, 0.44), seed: rand(0, 6.28)
      });
    }
  }

  /* ---------- 蓄墨 / 出鞘 ---------- */
  const HOLD_MAX = 3.2;
  const hold = { active: false, t: 0, x: 0, y: 0, d: 0 };
  const cur = { x: -100, y: -100 };

  function down(x, y) {
    hold.active = true; hold.t = 0; hold.x = x; hold.y = y; hold.d = 0;
  }
  function up(x, y) {
    if (!hold.active) return;
    const held = hold.t;
    hold.active = false;
    hold.d = 0;
    inkSplash(x, y, held);
    slash(x, y);
  }

  /* ---------- 输入 ---------- */
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    if (demo.on) return;
    demo.idle = 0;
    MOUSE.tx = e.clientX; MOUSE.ty = e.clientY; MOUSE.in = true;
    if (hold.active) { hold.x = e.clientX; hold.y = e.clientY; }
  });
  window.addEventListener('mouseleave', () => {
    if (!demo.on) { MOUSE.in = false; MOUSE.tx = -999; }
  });
  window.addEventListener('pointerdown', e => {
    if (demo.on) return;
    demo.idle = 0;
    down(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', e => {
    if (demo.on) return;
    up(e.clientX, e.clientY);
  });
  window.addEventListener('pointercancel', () => { if (!demo.on) up(hold.x, hold.y); });

  /* ---------- 自动演示（录屏用）：按 D 开关，或静止 8 秒自动开演 ---------- */
  const DEMO = [
    { t: 0.0,  x: 1290, y: 240 },
    { t: 1.3,  x: 1030, y: 330 },
    { t: 2.8,  x: W * 0.42, y: H * 0.72, down: true },
    { t: 5.3,  x: W * 0.42, y: H * 0.72, up: true },
    { t: 6.5,  x: 1180, y: 320 },
    { t: 9.4,  x: 500, y: 300 },
    { t: 9.7,  x: 500, y: 300, down: true },
    { t: 10.4, x: 500, y: 300, up: true },
    { t: 11.4, x: 860, y: 640 },
    { t: 12.8, x: 1290, y: 240 }
  ];
  const demo = { on: false, t: 0, i: 1, idle: 0 };
  const easeIO = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  function demoStart() {
    demo.on = true; demo.t = 0; demo.i = 1; demo.idle = 0;
    if (hold.active) { hold.active = false; hold.d = 0; }
    MOUSE.in = true;
    MOUSE.tx = DEMO[0].x; MOUSE.ty = DEMO[0].y;
    cur.x = DEMO[0].x; cur.y = DEMO[0].y;
  }
  function demoStop() {
    demo.on = false;
    if (hold.active) { hold.active = false; hold.d = 0; }
  }

  window.addEventListener('keydown', e => {
    if (e.key === 'd' || e.key === 'D') { demo.on ? demoStop() : demoStart(); }
    if (e.code === 'Space' || e.code === 'Enter') {
      const x = W * rand(0.32, 0.68), y = H * rand(0.32, 0.62);
      strokes.push({ pts: bladeScreen().map(p => ({ x: p.x, y: p.y })), life: 0, dur: 900, w: 3 });
      inkSplash(x, y, rand(0.4, 2.4));
      slash(x, y);
    }
  });

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cover = Math.max(W / IW, H / IH);
    seedMotes();
  }

  /* ---------- 主循环 ---------- */
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(48, now - last); last = now;
    ctx.clearRect(0, 0, W, H);

    /* === 背景视差 === */
    const cx0 = (MOUSE.tx > -500 ? MOUSE.tx : W / 2) / W - 0.5;
    const cy0 = (MOUSE.ty > -500 ? MOUSE.ty : H / 2) / H - 0.5;
    parX += (cx0 * -26 - parX) * 0.055;
    parY += (cy0 * -16 - parY) * 0.055;
    stage.style.setProperty('--px', parX.toFixed(2) + 'px');
    stage.style.setProperty('--py', parY.toFixed(2) + 'px');

    const mvx = MOUSE.tx - MOUSE.px, mvy = MOUSE.ty - MOUSE.py;
    MOUSE.px = MOUSE.tx; MOUSE.py = MOUSE.ty;

    /* === 自动演示 === */
    if (demo.on) {
      demo.t += dt / 1000;
      const k = DEMO;
      while (demo.i < k.length && demo.t >= k[demo.i].t) {
        const s = k[demo.i];
        if (s.down) down(s.x, s.y);
        if (s.up) up(s.x, s.y);
        demo.i++;
      }
      const a = k[Math.max(0, demo.i - 1)];
      const b = k[Math.min(k.length - 1, demo.i)];
      const span = Math.max(0.001, b.t - a.t);
      const p = easeIO(clamp((demo.t - a.t) / span, 0, 1));
      MOUSE.tx = a.x + (b.x - a.x) * p;
      MOUSE.ty = a.y + (b.y - a.y) * p;
      MOUSE.in = true;
      if (demo.i >= k.length && demo.t > k[k.length - 1].t + 0.9) demoStart();
    } else {
      demo.idle += dt / 1000;
      if (demo.idle > 8) demoStart();
    }

    /* === 蓄墨计时 === */
    if (hold.active) {
      hold.t = Math.min(HOLD_MAX, hold.t + dt / 1000);
      hold.d += ((hold.t / HOLD_MAX) - hold.d) * 0.1;
      inkDuringHold(hold.x, hold.y, hold.t / HOLD_MAX);
    }

    /* === 刀的位置与悬停 === */
    const pts = bladeScreen();
    let hover = { dist: 1e9, t: 0, x: 0, y: 0 };
    if (MOUSE.in) hover = nearestOnBlade(MOUSE.tx, MOUSE.ty, pts);
    const near = MOUSE.in && hover.dist < 150;
    gleam.hoverD += ((near ? 1 - hover.dist / 150 : 0) - gleam.hoverD) * 0.12;
    if (near) {
      gleam.hoverU += (hover.t - gleam.hoverU) * 0.18;
      if (Math.random() < 0.3) sparkAt(hover.x + rand(-10, 10), hover.y + rand(-10, 10), 1, 0.55);
    }

    /* === 随机寒芒 === */
    if (sparkle.active) {
      sparkle.life += dt;
      if (sparkle.life >= sparkle.dur) { sparkle.active = false; sparkle.wait = rand(1100, 3200); }
    } else {
      sparkle.wait -= dt;
      if (sparkle.wait <= 0) sparkleOnBlade();
    }

    /* === 尘埃 === */
    for (const m of motes) {
      const dx = m.x - MOUSE.tx, dy = m.y - MOUSE.ty;
      const d2 = dx * dx + dy * dy;
      if (d2 < 26000 && d2 > 0.01) {
        const d = Math.sqrt(d2), f = (1 - d / 161) * 0.9;
        m.vx += (dx / d) * f * 0.55 + mvx * 0.012 * f;
        m.vy += (dy / d) * f * 0.55 + mvy * 0.012 * f;
      }
      m.vx *= 0.965; m.vy *= 0.965;
      m.vx += Math.sin(now / 1400 + m.seed) * 0.004;
      m.vy = Math.max(m.vy - 0.006, -1.2);
      m.x += m.vx; m.y += m.vy;
      if (m.y < -20) { m.y = H + 10; m.x = rand(0, W); m.vy = rand(-0.3, -0.08); }
      if (m.x < -20) m.x = W + 10;
      if (m.x > W + 20) m.x = -10;
      if (m.y > H + 20) m.y = -10;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(20,20,22,' + m.a + ')';
      ctx.arc(m.x, m.y, m.r, 0, 6.283);
      ctx.fill();
    }

    /* === 墨环 === */
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      if (s.delay > 0) s.delay -= dt;
      s.life += dt;
      const p = Math.max(0, Math.min(1, (s.life - s.delay) / s.dur));
      if (p <= 0) continue;
      if (p >= 1) { splashes.splice(i, 1); continue; }
      const ease = 1 - Math.pow(1 - p, 2.6);
      const radius = 2 + (s.max - 2) * ease;
      const fade = Math.pow(1 - p, 1.7);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.wob);
      ctx.beginPath();
      const seg = 14;
      for (let k = 0; k <= seg; k++) {
        const ang = (k / seg) * 6.283;
        const noise = 1 + Math.sin(ang * 3 + s.wob * 4) * 0.05 + Math.cos(ang * 5 - p * 3) * 0.04;
        const rr = radius * noise;
        const px = Math.cos(ang) * rr * 1.06, py = Math.sin(ang) * rr * 0.82;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(18,18,20,' + (s.alpha * fade) + ')';
      ctx.lineWidth = s.line * (1 - p * 0.45);
      ctx.stroke();
      if (p < 0.55) {
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
        g.addColorStop(0, 'rgba(20,20,24,' + ((0.08 + 0.14 * (s.line / 3)) * fade) + ')');
        g.addColorStop(0.7, 'rgba(20,20,24,' + (0.05 * fade) + ')');
        g.addColorStop(1, 'rgba(20,20,24,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, radius, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }

    /* === 飞溅墨点 === */
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.life += dt;
      const p = d.life / d.dur;
      if (p >= 1) { drops.splice(i, 1); continue; }
      d.vx *= d.drag;
      d.vy = d.vy * d.drag + 0.055;
      d.x += d.vx; d.y += d.vy;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(15,15,18,' + (Math.pow(1 - p, 1.8) * 0.75) + ')';
      ctx.lineWidth = d.r * (1 - p * 0.3);
      ctx.lineCap = 'round';
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.vx * 1.6, d.y - d.vy * 1.6);
      ctx.stroke();
    }

    /* === 墨滴 === */
    for (let i = drips.length - 1; i >= 0; i--) {
      const d = drips[i];
      d.life += dt;
      const p = d.life / d.dur;
      if (p >= 1) { drips.splice(i, 1); continue; }
      d.vx *= d.drag; d.vy = d.vy * d.drag + 0.02;
      d.x += d.vx * dt / 16; d.y += d.vy * dt / 16;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(14,14,17,' + (Math.pow(1 - p, 1.6) * 0.7) + ')';
      ctx.arc(d.x, d.y, Math.max(0.2, d.r * (1 - p * 0.4)), 0, 6.283);
      ctx.fill();
    }

    /* === 气浪 === */
    for (let i = streaks.length - 1; i >= 0; i--) {
      const s = streaks[i];
      s.life += dt;
      const p = s.life / s.dur;
      if (p >= 1) { streaks.splice(i, 1); continue; }
      s.x += s.vx * dt / 16; s.y += s.vy * dt / 16;
      s.vx *= 0.97; s.vy *= 0.97;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,255,255,' + (Math.pow(1 - p, 2) * 0.7) + ')';
      ctx.lineWidth = s.w;
      ctx.lineCap = 'round';
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 2.4, s.y - s.vy * 2.4);
      ctx.stroke();
    }

    /* ================= 寒光 ================= */
    ctx.globalCompositeOperation = 'lighter';

    const drawBladeSeg = (a, b, alpha, width, core) => {
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, 'rgba(150,195,255,0)');
      g.addColorStop(0.42, 'rgba(190,225,255,' + (alpha * 0.75) + ')');
      g.addColorStop(0.82, 'rgba(245,252,255,' + alpha + ')');
      g.addColorStop(1, 'rgba(150,195,255,0)');
      ctx.save();
      ctx.strokeStyle = g;
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(170,215,255,.95)';
      ctx.shadowBlur = 20 + 26 * alpha;
      ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      if (core) {
        ctx.shadowBlur = 8;
        ctx.strokeStyle = 'rgba(255,255,255,' + (alpha * 0.85) + ')';
        ctx.lineWidth = Math.max(0.6, width * 0.3);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.restore();
    };

    // 出鞘：随机位置的刀光段
    for (let i = slashes.length - 1; i >= 0; i--) {
      const s = slashes[i];
      s.life += dt;
      const p = s.life / s.dur;
      if (p >= 1) { slashes.splice(i, 1); continue; }
      const a = pointAt(s.u0, pts), b = pointAt(s.u1, pts);
      const head = pointAt(s.u0 + (s.u1 - s.u0) * Math.min(1, p * 1.5), pts);
      const alpha = (1 - p) * (0.55 + 0.45 * Math.pow(p, 0.4));
      drawBladeSeg(a, b, Math.min(1, alpha), s.w * (1.25 - p * 0.35), true);
      const rg = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 34);
      rg.addColorStop(0, 'rgba(255,255,255,' + (alpha * 0.9) + ')');
      rg.addColorStop(0.32, 'rgba(180,220,255,' + (alpha * 0.45) + ')');
      rg.addColorStop(1, 'rgba(140,190,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(head.x, head.y, 34, 0, 6.283); ctx.fill();
    }

    // 飞溅的寒光点
    for (let i = glints.length - 1; i >= 0; i--) {
      const q = glints[i];
      q.life += dt;
      const p = q.life / q.dur;
      if (p >= 1) { glints.splice(i, 1); continue; }
      const p0 = pointAt(clamp(q.u - 0.035, 0, 1), pts);
      const p1 = pointAt(clamp(q.u + 0.035, 0, 1), pts);
      drawBladeSeg(p0, p1, q.a * (1 - p), q.r * 0.28, false);
      const rg = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r * (0.6 + p));
      rg.addColorStop(0, 'rgba(255,255,255,' + (q.a * 0.75 * (1 - p)) + ')');
      rg.addColorStop(0.4, 'rgba(180,220,255,' + (q.a * 0.28 * (1 - p)) + ')');
      rg.addColorStop(1, 'rgba(140,190,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.6 + p), 0, 6.283); ctx.fill();
    }

    // 静谧时随机闪现的寒芒
    if (sparkle.active) {
      const a = Math.pow(1 - sparkle.life / sparkle.dur, 1.4);
      const h = pointAt(sparkle.u, pts);
      const t0 = pointAt(clamp(sparkle.u - 0.05, 0, 1), pts);
      drawBladeSeg(t0, h, a * 0.75, 3.2, true);
      const rg = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 22);
      rg.addColorStop(0, 'rgba(255,255,255,' + (a * 0.85) + ')');
      rg.addColorStop(1, 'rgba(150,200,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(h.x, h.y, 22, 0, 6.283); ctx.fill();
    }

    // 出鞘聚光 + 十字星芒
    if (bloom.a > 0.01) {
      bloom.r += dt * 0.22;
      bloom.a *= Math.pow(0.9, dt / 16);
      const g = ctx.createRadialGradient(bloom.x, bloom.y, 0, bloom.x, bloom.y, bloom.r + 30);
      g.addColorStop(0, 'rgba(255,255,255,' + (bloom.a * 0.55) + ')');
      g.addColorStop(0.35, 'rgba(180,220,255,' + (bloom.a * 0.25) + ')');
      g.addColorStop(1, 'rgba(140,190,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bloom.x, bloom.y, bloom.r + 30, 0, 6.283); ctx.fill();
      ctx.save();
      ctx.translate(bloom.x, bloom.y);
      ctx.strokeStyle = 'rgba(230,245,255,' + (bloom.a * 0.7) + ')';
      ctx.lineWidth = 1.1;
      const L = 26 + bloom.r * 0.8;
      ctx.beginPath();
      ctx.moveTo(-L, 0); ctx.lineTo(L, 0);
      ctx.moveTo(0, -L * 0.75); ctx.lineTo(0, L * 0.75);
      ctx.stroke();
      ctx.restore();
    } else bloom.a = 0;

    // 悬停时刀身柔光
    if (gleam.hoverD > 0.02) {
      const a = pointAt(clamp(gleam.hoverU - 0.22, 0, 1), pts);
      const b = pointAt(clamp(gleam.hoverU + 0.22, 0, 1), pts);
      drawBladeSeg(a, b, gleam.hoverD * 0.5, 3.4, false);
      const h = pointAt(gleam.hoverU, pts);
      const rg = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 20 + 14 * gleam.hoverD);
      rg.addColorStop(0, 'rgba(255,255,255,' + (0.5 * gleam.hoverD) + ')');
      rg.addColorStop(1, 'rgba(160,205,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(h.x, h.y, 20 + 14 * gleam.hoverD, 0, 6.283); ctx.fill();
    }

    // 蓄墨时刀身蓄势微光
    if (hold.d > 0.05) {
      const a = pointAt(0.10, pts), b = pointAt(0.78, pts);
      ctx.save();
      ctx.strokeStyle = 'rgba(210,235,255,' + (0.20 * hold.d) + ')';
      ctx.shadowColor = 'rgba(170,215,255,.9)';
      ctx.shadowBlur = 26 * hold.d;
      ctx.lineWidth = 2 + 3 * hold.d;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.restore();
    }

    /* === 寒星 === */
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      const p = s.life / s.dur;
      if (p >= 1) { sparks.splice(i, 1); continue; }
      s.vx *= s.drag;
      s.vy = s.vy * s.drag + 0.02;
      s.x += s.vx * dt / 16; s.y += s.vy * dt / 16;
      const al = Math.pow(1 - p, 2);
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(225,240,255,' + (al * 0.95) + ')';
      ctx.lineWidth = s.r;
      ctx.lineCap = 'round';
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 2.2, s.y - s.vy * 2.2);
      ctx.stroke();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + (al * 0.6) + ')';
      ctx.arc(s.x, s.y, s.r * 1.5, 0, 6.283);
      ctx.fill();
    }

    /* === 全屏冷光闪 === */
    if (flash.a > 0.004) {
      ctx.fillStyle = 'rgba(225,240,255,' + flash.a + ')';
      ctx.fillRect(0, 0, W, H);
      flash.a *= Math.pow(0.86, dt / 16);
    } else flash.a = 0;

    ctx.globalCompositeOperation = 'source-over';

    /* === 笔尖（蓄墨时凝成一个墨点） === */
    if (MOUSE.in) {
      cur.x += ((hold.active ? hold.x : MOUSE.tx) - cur.x) * 0.22;
      cur.y += ((hold.active ? hold.y : MOUSE.ty) - cur.y) * 0.22;
      const cr = 26;
      const g = ctx.createRadialGradient(cur.x, cur.y, 0, cur.x, cur.y, cr);
      g.addColorStop(0, 'rgba(255,255,255,.5)');
      g.addColorStop(0.35, 'rgba(255,255,255,.15)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cur.x, cur.y, cr, 0, 6.283); ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(12,12,14,.88)';
      ctx.arc(cur.x, cur.y, 2.3, 0, 6.283); ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
